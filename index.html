<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Playable0506</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    #unity-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
    #unity-canvas { aspect-ratio: 9 / 16; height: 100vh; max-width: 100vw; background: #000; display: block; }
    @media (max-aspect-ratio: 9/16) { #unity-canvas { width: 100vw; height: auto; } }
    #unity-loading-bar { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60vmin; max-width: 320px; text-align: center; color: #fff; }
    #unity-loading-bar.hidden { display: none; }
    #unity-progress-bar-empty { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 12px; }
    #unity-progress-bar-full { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd860, #ffaa30); transition: width 0.2s; }
    #unity-loading-text { font-size: 14px; letter-spacing: 1px; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-loading-text">Loading…</div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
  </div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var loadingBar = document.getElementById("unity-loading-bar");
    var progressBarFull = document.getElementById("unity-progress-bar-full");
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/webgl-build.data",
      frameworkUrl: buildUrl + "/webgl-build.framework.js",
      codeUrl: buildUrl + "/webgl-build.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Playable0506",
      productVersion: "1.0"
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/webgl-build.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        loadingBar.classList.add("hidden");
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
